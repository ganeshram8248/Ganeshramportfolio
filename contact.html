<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganeshram S - Contact </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --header-bg: linear-gradient(135deg, #007bff, #00d4ff);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1a1a2e;
            --text-light: #555;
            --accent: #007bff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background: var(--primary-bg);
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* MOBILE HEADER */
        header {
            background: var(--header-bg);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* MOBILE HAMBURGER MENU */
        nav {
            background: rgba(248, 249, 250, 0.95);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--accent);
            cursor: pointer;
            padding: 10px;
            float: right;
        }

        .nav-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .nav-menu.active {
            display: flex;
        }

        nav a {
            color: var(--accent);
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            display: block;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        nav a:hover, nav a.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* CONTACT INFO CARDS - MOBILE STACK */
        .contact-hero {
            padding: 40px 25px;
            text-align: center;
        }

        .contact-hero h2 {
            color: var(--accent);
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        .contact-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }

        .contact-card {
            background: white;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .contact-card:active {
            transform: scale(0.98);
        }

        .contact-icon {
            font-size: 2.5rem;
            color: var(--accent);
            width: 60px;
            text-align: center;
        }

        .contact-details h3 {
            color: var(--text-dark);
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .contact-details p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        /* MOBILE FORM - LARGE INPUTS */
        .form-section {
            padding: 40px 25px;
            background: rgba(248,249,250,0.6);
        }

        .form-container {
            background: white;
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            max-width: 500px;
            margin: 0 auto;
        }

        .form-container h2 {
            text-align: center;
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        input, textarea {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            font-size: 1.1rem;
            background: #f8f9fa;
            transition: all 0.3s ease;
            font-family: inherit;
            touch-action: manipulation;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(0,123,255,0.1);
            transform: scale(1.02);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .btn-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent), #00d4ff);
            color: white;
        }

        .btn-submit:active {
            transform: scale(0.95);
        }

        .btn-reset {
            background: #6c757d;
            color: white;
        }

        .btn-reset:active {
            transform: scale(0.95);
        }

        /* THANK YOU */
        .thankyou {
            padding: 40px 25px;
            text-align: center;
        }

        .thankyou h2 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }

        /* SOCIAL - MOBILE FRIENDLY */
        .social-section {
            padding: 40px 25px;
            background: rgba(248,249,250,0.8);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-links a {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .social-links a:active {
            transform: scale(0.9);
        }

        .social-links .instagram { background: #e4405f; color: white; }
        .social-links .linkedin { background: #0077b5; color: white; }
        .social-links .email { background: #ff6b6b; color: white; }
        .social-links .whatsapp { background: #25d366; color: white; }

        /* TABLET & DESKTOP */
        @media (min-width: 768px) {
            .menu-toggle { display: none; }
            .nav-menu {
                display: flex !important;
                flex-direction: row;
                justify-content: center;
                gap: 10px;
                margin-top: 0;
            }
            
            nav a {
                margin: 0 5px;
                padding: 12px 20px;
            }
            
            .contact-grid {
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .contact-card {
                flex: 1;
                min-width: 300px;
            }
            
            .btn-row {
                flex-direction: row;
            }
            
            body { padding: 20px 30px; }
        }

        @media print {
            body { background: white !important; padding: 0; }
            .container { box-shadow: none; }
            nav, .social-links, .thankyou { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1><i class="fas fa-envelope"></i> Contact Me</h1>
        </header>

        <!-- Mobile Navigation -->
        <nav>
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="nav-menu" id="navMenu">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="projects.html"><i class="fas fa-project-diagram"></i> Projects</a>
                <a href="About.html"><i class="fas fa-user"></i> About</a>
                <a href="resume.html"><i class="fas fa-file-alt"></i> Resume</a>
                            </div>
        </nav>

        <!-- Contact Info -->
        <section class="contact-hero">
            <h2>Let's Connect</h2>
            <div class="contact-grid">
                <div class="contact-card" onclick="copyEmail()">
                    <i class="fas fa-envelope contact-icon"></i>
                    <div class="contact-details">
                        <h3>Email</h3>
                        <p>ganeshram8248@gmail.com</p>
                    </div>
                </div>
                <div class="contact-card" onclick="makeCall()">
                    <i class="fas fa-phone contact-icon"></i>
                    <div class="contact-details">
                        <h3>Phone</h3>
                        <p>+91 8248703979</p>
                    </div>
                </div>
                <div class="contact-card">
                    <i class="fas fa-map-marker-alt contact-icon"></i>
                    <div class="contact-details">
                        <h3>Location</h3>
                        <p>Madurai, Tamil Nadu<br>India 625002</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Contact Form -->
        <section class="form-section">
            <div class="form-container">
                <h2><i class="fas fa-paper-plane"></i> Send Message</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <input type="text" id="name" placeholder="Your Name *" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" placeholder="Your Email *" required>
                    </div>
                    <div class="form-group">
                        <textarea id="message" placeholder="Your Message *" required></textarea>
                    </div>
                    <div class="btn-row">
                        <button type="submit" class="btn-submit">
                            <i class="fas fa-paper-plane"></i> Send
                        </button>
                        <button type="reset" class="btn-reset">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Thank You -->
        <section class="thankyou">
            <h2>THANK YOU!</h2>
        </section>

        <!-- Social Links -->
        <div class="social-section">
            <div class="social-links">
                <a href="https://www.instagram.com/ganesh__ram_07" target="_blank" class="instagram" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.linkedin.com/in/ganeshram-s-534b20371" target="_blank" class="linkedin" title="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="mailto:ganeshram8248@gmail.com" class="email" title="Email">
                    <i class="fas fa-envelope"></i>
                </a>
                <a href="https://wa.me/8248703979" target="_blank" class="whatsapp" title="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        // MOBILE MENU TOGGLE
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }

        // MOBILE FRIENDLY FUNCTIONS
        function copyEmail() {
            navigator.clipboard.writeText('ganeshram8248@gmail.com');
            alert('Email copied to clipboard!');
        }

        function makeCall() {
            window.location.href = 'tel:+918248703979';
        }

        // FORM HANDLING - MOBILE FRIENDLY
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            alert(`Thank you ${name}! Message sent successfully!`);
            this.reset();
        });

        // CLOSE MENU ON LINK CLICK
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navMenu').classList.remove('active');
            });
        });

        // PREVENT ZOOM ON MOBILE INPUTS
        let viewport = document.querySelector('meta[name="viewport"]');
        document.querySelectorAll('input, textarea').forEach(input => {
            input.addEventListener('focus', () => {
                viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
            });
            input.addEventListener('blur', () => {
                viewport.setAttribute('content', 'width=device-width, initial-scale=1.0');
            });
        });
    </script>
</body>
</html>
